<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>アント・コマンド 動作確認ページ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <h1>アント・コマンド 動作確認ページ</h1>
  <p class="note">バックエンド(向き・移動・ジャンプ・待つ・移動関数・もし・の間・くり返し・敵)の動作確認用の簡易画面です。</p>

  <section>
    <label for="stageSelect">ステージ:</label>
    <select id="stageSelect">
      <option value="1">ステージ1</option>
      <option value="2">ステージ2</option>
      <option value="3">ステージ3</option>
      <option value="4">ステージ4</option>
      <option value="5">ステージ5</option>
      <option value="6">ステージ6</option>
    </select>
    <span id="stageName"></span>
  </section>

  <!-- マップ表示エリア(JavaScriptで作る) -->
  <div id="grid" aria-label="マップ"></div>
  <p id="inventory"></p>

  <section>
    <h2>ブロックを追加</h2>
    <div class="controls">
      移動関数: 方向
      <select id="funcDir">
        <option value="UP">↑上</option>
        <option value="DOWN">↓下</option>
        <option value="LEFT">←左</option>
        <option value="RIGHT" selected>→右</option>
      </select>
      移動回数:
      <input type="number" id="funcCount" value="3" min="1" max="100">
    </div>
    <div class="controls">
      条件:
      <select id="condSelect">
        <option value="WALL_AHEAD">目の前に壁がある</option>
        <option value="ENEMY_AHEAD">目の前に敵がいる</option>
        <option value="PIT_AHEAD">目の前に落とし穴がある</option>
        <option value="ENEMY_COMING">目の前に敵が来る</option>
      </select>
      <label><input type="checkbox" id="notCheck"> でない</label>
      回数:
      <input type="number" id="repeatCount" value="3" min="1" max="100">
    </div>
    <div id="palette"></div>
    <p class="note">「前へ移動」「前へジャンプ」は、アリが今向いている方向へ進みます(向きはマップの矢印と、持ち物の行の「向き」で確認できます)。「移動関数」は、方向を向いて回数ぶん移動します。</p>
    <p class="note">「もし」「の間」「回くり返す」は中にブロックを入れられます。入れたい枠の「ここに追加」をクリックしてから、ブロックを追加してください。</p>
  </section>

  <section>
    <h2>プログラム</h2>
    <div id="program"></div>
    <button id="runButton" type="button">実行</button>
    <button id="undoButton" type="button">1つ取り消す</button>
    <button id="clearButton" type="button">プログラムを消す</button>
  </section>

  <p id="message" role="status"></p>

  <script src="js/app.js"></script>
</body>
</html>
