<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aligorithm - ルール説明</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <main class="screen rule-screen" id="screen">
    <div class="shell">
      <header class="topbar">
        <!-- 左上に戻るボタン -->
        <a class="navbtn secondary" href="stages.html">← 戻る</a>
        <div class="spacer"></div>
      </header>
      
      <!-- ルール説明のパネル -->
      <div class="panel rules-panel" style="padding: 24px; max-width: 800px; margin: 0 auto; width: 100%;">
        <h1>ゲームルール</h1>
          <ol>
            <h1>博士の作った構成のアリロボットでゴールを目指そう!</h1>
            <li>プログラミングブロックを組み立てて、アリロボットに命令をだそう</li>
            <li>「前へ移動」は、アリが向いている方向へ進むよ。向きを変えるには「向く」を使おう。</li>
            <li>道に落ちている物資を拾ってスイッチに乗るとドアが開く!武器を拾えば敵を倒せる。</li>
            <li>落とし穴は「ジャンプ」で飛び越えよう。</li>
            <li>テスト実行して動きを確認しよう。うまくいけば実行ボタンでアリを動かそう!</li>
            <li>動く敵に注意!待つコマンドを上手く使って回避しよう</li>
            <li>制御ブロックを使って命令を短くしよう</li>
            </ol>
      </div>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/assets.js"></script>
</body>
</html>
