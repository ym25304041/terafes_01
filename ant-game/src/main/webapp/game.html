<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ゲームプレイ | アント・コマンド</title>
  <link rel="stylesheet" href="css/game.css">
  <!--
    このページ専用のCSS（一時的にここに書いています。あとで css フォルダのファイルへ移します）
    ※ 共通の css/game.css より後ろに書いているので、同じ名前のルールは、ここが優先されます。
    ※ <style> を使うため、サーバー(SecurityHeadersFilter)で、game.html だけ style-src を緩めています。
       CSS をファイルへ移したら、その例外も削除してください。
  -->
  <style>
    /* プログラムの見出し: 右端に「クリア」ボタン(プログラムのブロックを空にする)を置く */
    .program-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .clear-btn {
      border: 2px solid #fff; border-radius: 10px; padding: 3px 14px;
      background: linear-gradient(#ff7b6b, #e0483f); color: #fff;
      font-weight: 900; font-size: clamp(13px, .95vw, 17px); cursor: pointer;
      box-shadow: 0 2px 0 rgba(0, 0, 0, .2);
    }
    .clear-btn:hover { filter: brightness(1.08); }
    .clear-btn:disabled { filter: grayscale(1); opacity: .55; cursor: not-allowed; }

    /* もちもの枠(ミッションカードの右側): 持てるアイテムは1つだけ */
    .held-card {
      background: #fff6df; border-radius: 14px; padding: 8px 12px;
      display: flex; align-items: center; gap: 12px; min-height: 76px;
    }
    .held-title { font-weight: 900; font-size: clamp(13px, .95vw, 17px); line-height: 1.3; }
    /* アイテムの画像を表示する領域は、正方形(幅と高さが同じ)にする */
    .held-card { --held-size: clamp(64px, 5.6vw, 80px); justify-content: center; }
    .held-slot {
      flex: none; width: var(--held-size); height: var(--held-size); aspect-ratio: 1 / 1;
      border-radius: 12px; border: 3px dashed #e3b95b; background: #fffdf5;
      display: flex; align-items: center; justify-content: center; padding: 4px;
      font-weight: 900; color: #8a6a1c; font-size: clamp(14px, 1vw, 18px);
    }
    .held-slot.have { border-style: solid; border-color: #ffb300; background: #fff2c8; color: #143a59; }
    .held-slot .item { position: static; width: 100%; height: 100%; inset: auto; }
    .held-slot .item > img { width: 100%; height: 100%; object-fit: contain; }
    .held-slot .glyph { font-size: calc(var(--held-size) * .6); line-height: 1; }

    /* プログラムの最後へドロップするための領域(空きの部分全体) */
    .program-stack { min-height: 100%; display: flex; flex-direction: column; }
    .program-stack > .slot-head { align-self: flex-start; }
    .end-zone {
      flex: 1; min-height: 56px; margin-top: 6px; border: 2px dashed transparent; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: #7a93a8;
    }
    .end-zone.drop-over { border-color: #ffb300; background: #fff8e1; }

    /* 操作ボタン: 左に「テスト実行」、右に「実行」 */
    .controls { grid-template-columns: 1fr 1.2fr; }
    .controls .test { background: linear-gradient(#3fa8ff, #1378db); color: #fff; }

    /* 「アイテムを捨てる」ブロックの色 */
    .b-drop { background: #c0562d; }
  </style>
</head>
<body>
  <!-- ゲームプレイ画面: URL の ?stage=番号 のステージを、js/game.js が読み込んで表示する -->
  <main class="screen" id="screen">
    <div class="shell">

      <!-- メニュー(ハンバーガー) -->
      <div class="menu-wrap">
        <details>
          <summary>☰</summary>
          <div class="menu-panel">
            <a href="index.html">⌂ ホーム</a>
            <a href="stages.html">▦ ステージ選択</a>
          </div>
        </details>
      </div>

      <div class="game-layout">

        <!-- 左側: ミッションと、マップ -->
        <section class="game-left">
          <div class="panel mission-card">
            <div class="stage-no"><small>ステージ</small><b id="stageNo">-</b></div>
            <div class="mission-title">
              <h2 id="missionTitle">読み込み中…</h2>
              <p id="missionDesc"></p>
            </div>
            <!-- もちもの枠: 持っているアイテムを表示する(js/game.js が中身を入れる) -->
            <div class="held-card">
              <div class="held-title">🎒<br>もちもの</div>
              <div class="held-slot" id="heldSlot"></div>
            </div>
          </div>

          <div class="board-panel">
            <div class="map-wrap" id="mapWrap">
              <!-- マップ: 縦5×横9のマスと、アリ・敵は、js/game.js が作る -->
              <div class="map-stage" id="mapStage">
                <div class="map-grid" id="mapGrid" aria-label="マップ"></div>
                <div class="units" id="units"></div>
              </div>
            </div>
          </div>
        </section>

        <!-- 右側: ブロックのパレットと、プログラム -->
        <section class="game-right">
          <div class="right-panels">
            <div class="panel side-panel">
              <div class="panel-title">🧩 ブロック</div>
              <div class="scroll-area" id="palette"></div>
            </div>

            <div class="panel side-panel program-panel">
              <div class="panel-title program-title">
                <span>📜 プログラム</span>
                <button class="clear-btn" id="clearButton" type="button" title="プログラムのブロックをすべて消します">クリア</button>
              </div>
              <div class="scroll-area">
                <div class="program-stack" id="program"></div>
              </div>
            </div>
          </div>

          <div class="message-bar" id="message" role="status">ブロックをドラッグして、プログラムに入れよう。(クリックでも追加できるよ)</div>

          <div class="controls">
            <button class="btn test" id="testButton" type="button" title="動きを確かめるだけ(ゴールの判定をしない)。終わると3秒後に最初の状態に戻ります">▷ テスト実行</button>
            <button class="btn run" id="runButton" type="button">▶ 実行</button>
          </div>
        </section>
      </div>
    </div>
  </main>
  <script src="js/common.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/api.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
